# This is a basic workflow to help you get started with Actions

name: pierwszy_przeplyw

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  moje_pierwsze_zadanie:
    # The type of runner that the job will run on
    runs-on: debian13_runner1

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Sprawdzamy wersję Python
        run: python3 -V

      - name: Wyświetl aktualny katalog roboczy
        run: pwd

      - name: Wyświetl listę plików
        run: ls -a

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Wyświetl listę plików po checkout
        run: ls -a

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          # Version range or exact version of Python or PyPy to use, using SemVer's version range syntax. Reads from .python-version if unset.
          python-version: '3.16'

      - name: Sprawdzamy wersję Python po instalacji
        run: python3 -V